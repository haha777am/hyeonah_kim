<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25FW Collection — HYEON AH KIM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* [1] 공통 스타일 및 애니메이션 */
        body {
            margin: 0; background-color: #0b0b0b; color: #fff;
            font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden;
            cursor: none; 
            animation: fadeInPage 0.8s ease forwards;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        body.fade-out { opacity: 0 !important; transition: opacity 0.5s ease; }

        /* 커스텀 커서 */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            background-color: #fff; border-radius: 50%; pointer-events: none; 
            z-index: 10005; transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
            mix-blend-mode: difference; 
        }
        .custom-cursor.hover { width: 45px; height: 45px; background-color: transparent; border: 1px solid #fff; }

        /* [2] 네비게이션 */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 40px 0; display: flex; justify-content: center;
        }
        .nav-capsule {
            display: flex; background: rgba(255,255,255,0.08);
            border-radius: 50px; padding: 6px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-capsule a {
            text-decoration: none; color: #777; padding: 10px 25px;
            border-radius: 50px; font-size: 13px; letter-spacing: 1px; transition: 0.4s;
        }
        .nav-capsule a:hover, .nav-capsule a.active { color: #fff; }

        /* [3] 상세 페이지 레이아웃 */
        .project-container {
            padding: 150px 0 100px;
            max-width: 1300px; margin: 0 auto;
        }

        .project-hero, .project-info {
            padding-left: 5%; padding-right: 5%;
        }

        .project-hero { margin-bottom: 80px; text-align: center; }
        .project-hero h1 { font-family: 'Playfair Display', serif; font-size: 6vw; margin: 0 0 20px; line-height: 1; }
        .project-meta { font-family: monospace; color: #a68d60; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; }

        .project-info {
            display: grid; grid-template-columns: 1fr 2fr; gap: 60px;
            border-top: 1px solid #222; border-bottom: 1px solid #222;
            padding: 60px 5%; margin-bottom: 80px;
        }
        .info-left h3 { font-family: monospace; font-size: 14px; color: #666; margin-bottom: 10px; letter-spacing: 2px;}
        .info-left p { margin-bottom: 30px; font-size: 15px; color: #ddd; }
        .info-right p { font-size: 16px; line-height: 1.8; color: #aaa; font-weight: 300; margin-top: 0; text-align: justify; }

        /* 🎬 유튜브 비디오 반응형 컨테이너 서식 */
        .video-section {
            padding: 0 5%;
            margin: 80px 0;
        }
        .video-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 비율 유지 */
            height: 0;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .video-wrap iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
