<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET IN TOUCH — HYEON AH KIM</title>
    <meta name="description" content="Hyeon Ah Kim에게 문의·협업 제안을 남겨주세요.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GET IN TOUCH — HYEON AH KIM">
    <meta property="og:description" content="Hyeon Ah Kim에게 문의·협업 제안을 남겨주세요.">
    <meta property="og:image" content="https://haha777am.github.io/hyeonah_kim/images/24fw/main.jpg">
    <meta property="og:url" content="https://haha777am.github.io/hyeonah_kim/contact.html">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; background-color: #0b0b0b; color: #fff;
            font-family: 'Noto Sans KR', sans-serif; cursor: none;
            min-height: 100vh; display: flex; align-items: center;
            animation: fadeInPage 1s ease forwards;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        body.fade-out { opacity: 0 !important; transition: opacity 0.5s ease; }

        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            background-color: #fff; border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease; mix-blend-mode: difference;
        }
        .custom-cursor.hover { width: 45px; height: 45px; background-color: transparent; border: 1px solid #fff; }

        .back-btn {
            position: fixed; top: 46px; left: 5%; z-index: 10;
            font-family: monospace; color: #666; text-decoration: none;
            font-size: 12px; letter-spacing: 2px; transition: 0.3s;
        }
        .back-btn:hover { color: #fff; padding-left: 10px; }

        .contact-wrapper {
            width: 90%; max-width: 1180px; margin: 0 auto; padding: 140px 0 100px;
            display: grid; grid-template-columns: 1fr 1.1fr; gap: 9vw; align-items: start;
        }

        /* 왼쪽: 타이틀 */
        .contact-info { position: sticky; top: 140px; animation: rise 1s ease both; }
        .eyebrow { font-family: monospace; font-size: 12px; letter-spacing: 5px; color: #6d6d6d; text-transform: uppercase; margin: 0 0 28px; }
        .contact-info h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(56px, 7.4vw, 112px); line-height: .95; letter-spacing: -2px; margin: 0; }
        .contact-info h1 em { color: #a68d60; }
        .lede { margin: 34px 0 0; color: #8e8e8e; font-size: 15px; line-height: 1.95; font-weight: 300; word-break: keep-all; max-width: 420px; }
        .lede span { display: block; margin-top: 6px; color: #5f5f5f; font-size: 13px; }
        .direct { margin-top: 52px; padding-top: 26px; border-top: 1px solid #1f1f1f; max-width: 420px; }
        .direct small { display: block; font-family: monospace; font-size: 11px; letter-spacing: 3px; color: #5f5f5f; text-transform: uppercase; margin-bottom: 12px; }
        .direct a { font-family: 'Playfair Display', serif; font-size: 24px; color: #ddd; text-decoration: none; transition: .3s; }
        .direct a:hover { color: #a68d60; }

        /* 오른쪽: 폼 */
        .contact-form { animation: rise 1s .15s ease both; }
        .field { margin-bottom: 40px; }
        .field label, .field legend { display: flex; gap: 14px; align-items: baseline; font-family: monospace; font-size: 11px; color: #6a6a6a; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2.5px; padding: 0; }
        .field label i, .field legend i { font-style: normal; color: #a68d60; }
        .field input, .field textarea {
            width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid #2a2a2a;
            padding: 12px 0; color: #fff; font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 300;
            outline: none; transition: border-color .4s; border-radius: 0; cursor: none;
        }
        .field textarea { resize: vertical; min-height: 120px; line-height: 1.7; }
        .field input::placeholder, .field textarea::placeholder { color: #3e3e3e; }
        .field input:focus, .field textarea:focus { border-bottom-color: #a68d60; }
        fieldset.field { border: 0; margin: 0 0 40px; padding: 0; }

        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .chips input { position: absolute; opacity: 0; pointer-events: none; }
        .chips label { margin: 0; display: inline-block; padding: 10px 18px; border: 1px solid #2a2a2a; border-radius: 40px; font-family: monospace; font-size: 11px; letter-spacing: 2px; color: #8a8a8a; text-transform: uppercase; cursor: none; transition: .3s; }
        .chips label:hover { border-color: #555; color: #ddd; }
        .chips input:checked + label { border-color: #a68d60; color: #0b0b0b; background: #a68d60; }
        .chips input:focus-visible + label { outline: 1px solid #fff; outline-offset: 3px; }

        .send-btn {
            display: inline-flex; align-items: center; gap: 16px;
            background: transparent; color: #a68d60; border: 1px solid #a68d60; border-radius: 40px;
            padding: 16px 30px; font-family: monospace; font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            cursor: none; transition: .4s; margin-top: 6px;
        }
        .send-btn span { transition: transform .4s; }
        .send-btn:hover { background: #a68d60; color: #0b0b0b; }
        .send-btn:hover span { transform: translateX(6px); }
        .send-btn:disabled { opacity: .5; }
        #form-status { margin: 22px 0 0; font-size: 13px; line-height: 1.8; color: #a68d60; min-height: 1em; }
        #form-status a { color: #fff; }

        .thanks { display: none; animation: rise .8s ease both; }
        .thanks p.eyebrow { margin-bottom: 18px; }
        .thanks h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(40px, 4.6vw, 64px); margin: 0 0 18px; line-height: 1; }
        .thanks h2 em { color: #a68d60; }
        .thanks p { color: #8e8e8e; font-weight: 300; line-height: 1.9; }
        .sent .contact-form form { display: none; }
        .sent .thanks { display: block; }

        @media (max-width: 900px) {
            .contact-wrapper { grid-template-columns: 1fr; gap: 64px; padding: 120px 0 80px; }
            .contact-info { position: static; }
            .direct { margin-top: 36px; }
        }
        @media (max-width: 768px) {
            .back-btn { top: 24px; font-size: 11px; }
            .custom-cursor { display: none; }
            body, .field input, .field textarea, .chips label, .send-btn { cursor: auto; }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="custom-cursor"></div>
    <a href="cv.html" class="back-btn">← BACK TO C.V</a>

    <main class="contact-wrapper" id="contact">
        <div class="contact-info">
            <p class="eyebrow">Contact — Hyeon Ah Kim</p>
            <h1>Get in<br><em>Touch</em></h1>
            <p class="lede">협업 제안, 프로젝트 문의, 함께 일할 기회까지 —<br>편하게 메시지를 남겨주세요.<span>I'd love to hear from you.</span></p>
            <div class="direct">
                <small>Or reach me on</small>
                <a href="https://instagram.com/corde.ah" target="_blank" rel="noopener">Instagram — @corde.ah ↗</a>
            </div>
        </div>

        <div class="contact-form">
            <form id="contact-form" novalidate>
                <div class="field">
                    <label for="f-name"><i>01</i> Name</label>
                    <input id="f-name" type="text" name="name" autocomplete="name" placeholder="이름 / 소속" required>
                </div>
                <div class="field">
                    <label for="f-email"><i>02</i> Email</label>
                    <input id="f-email" type="email" name="user_email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <fieldset class="field">
                    <legend><i>03</i> Inquiry</legend>
                    <div class="chips">
                        <input type="radio" name="topic" id="t1" value="Collaboration" checked><label for="t1">Collaboration</label>
                        <input type="radio" name="topic" id="t2" value="Project"><label for="t2">Project</label>
                        <input type="radio" name="topic" id="t3" value="Career"><label for="t3">Career</label>
                        <input type="radio" name="topic" id="t4" value="Other"><label for="t4">Other</label>
                    </div>
                </fieldset>
                <div class="field">
                    <label for="f-message"><i>04</i> Message</label>
                    <textarea id="f-message" name="message" rows="4" placeholder="내용을 적어주세요." required></textarea>
                </div>
                <button type="submit" class="send-btn">Send Message <span aria-hidden="true">→</span></button>
                <p id="form-status" role="status" aria-live="polite"></p>
            </form>

            <div class="thanks" role="status">
                <p class="eyebrow">Message Sent</p>
                <h2>Thank <em>you.</em></h2>
                <p>메시지가 잘 전달되었어요.<br>확인 후 회신드릴게요.</p>
            </div>
        </div>
    </main>

    <script>
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, button, input, textarea, .chips label').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        // 페이지 전환 효과
        document.querySelector('.back-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => { window.location.href = this.href; }, 500);
        });

        // 전송 (site.js 의 SITE 설정 사용)
        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = this;
            const status = document.getElementById('form-status');
            const btn = form.querySelector('.send-btn');
            const cfg = window.SITE || {};
            const d = Object.fromEntries(new FormData(form));

            if (!d.name.trim() || !d.message.trim() || !form.querySelector('#f-email').checkValidity() || !d.user_email) {
                status.textContent = '이름, 이메일, 메시지를 모두 입력해주세요.';
                return;
            }
            const subject = '[Portfolio · ' + d.topic + '] ' + d.name.trim() + ' 님의 문의';

            if (cfg.formEndpoint) {
                status.textContent = '보내는 중...';
                btn.disabled = true;
                try {
                    const res = await fetch(cfg.formEndpoint, {
                        method: 'POST',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: d.name, email: d.user_email, topic: d.topic, message: d.message, _subject: subject })
                    });
                    if (!res.ok) throw new Error('send failed');
                    status.textContent = '';
                    form.reset();
                    document.getElementById('contact').classList.add('sent');
                } catch (err) {
                    status.innerHTML = '전송에 실패했어요. 잠시 후 다시 시도하거나 <a href="' + (cfg.instagram || '#') + '" target="_blank" rel="noopener">Instagram DM</a>으로 연락 주세요.';
                } finally {
                    btn.disabled = false;
                }
            } else if (cfg.email) {
                const body = d.message + '\n\n— ' + d.name + ' (' + d.user_email + ')';
                window.location.href = 'mailto:' + cfg.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
                status.textContent = '이메일 앱이 열립니다.';
            } else {
                status.innerHTML = '지금은 폼으로 메시지를 받을 수 없어요. <a href="' + (cfg.instagram || '#') + '" target="_blank" rel="noopener">Instagram DM</a>으로 연락 주세요.';
            }
        });
    </script>
    <script src="site.js"></script>
</body>
</html>
