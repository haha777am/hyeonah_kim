<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFF THE RECORD — HYEON AH KIM</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* [1] 기본 테마 & 전환 효과 */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden;
            cursor: none; animation: fadeInPage 1s ease forwards;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        body.fade-out { opacity: 0 !important; transition: opacity 0.5s ease; }

        /* 커스텀 커서 */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            background-color: #fff; border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease; mix-blend-mode: difference;
        }
        .custom-cursor.hover { width: 45px; height: 45px; background-color: transparent; border: 1px solid #fff; }

        /* [2] 미니멀 네비게이션 (비밀 공간이므로 심플하게) */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 40px 5%; display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; mix-blend-mode: difference;
        }
        .back-btn {
            font-family: monospace; color: #fff; text-decoration: none;
            font-size: 13px; letter-spacing: 2px; transition: 0.3s;
        }
        .back-btn:hover { opacity: 0.5; letter-spacing: 4px; }
        .page-indicator {
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; color: #888;
        }

        /* [3] B-SIDE 레이아웃 */
        .bside-container {
            padding: 150px 5% 100px; max-width: 1600px; margin: 0 auto;
        }
        
        .bside-hero { margin-bottom: 80px; text-align: center; }
        .bside-hero h1 {
            font-family: 'Playfair Display', serif; font-size: 5vw; margin: 0 0 10px; line-height: 1; letter-spacing: -1px;
        }
        .bside-hero p { font-family: monospace; color: #555; letter-spacing: 3px; font-size: 13px; margin: 0; }

        /* 영상 그리드 */
.video-grid { column-count: 3; column-gap: 20px; }
.video-card { break-inside: avoid; margin: 0 0 28px; }
.video-frame { position: relative; overflow: hidden; background: #111; }
.video-frame video { width: 100%; display: block; filter: grayscale(50%); transition: filter 0.5s ease; }
.video-frame:hover video { filter: grayscale(0%); }
.video-frame iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
.video-card figcaption { margin-top: 12px; font-family: monospace; font-size: 12px; letter-spacing: 1px; color: #777; }
.sound-btn { position: absolute; right: 12px; bottom: 12px; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50px; background: rgba(0,0,0,0.55); color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 1px; cursor: none; }
.sound-btn:hover { border-color: #fff; }
.video-empty { text-align: center; font-family: monospace; font-size: 13px; letter-spacing: 3px; color: #444; padding: 80px 0; }

/* 모바일 대응 */
@media (max-width: 1024px) { .video-grid { column-count: 2; } }
@media (max-width: 768px) {
    .bside-hero h1 { font-size: 12vw; }
    .custom-cursor { display: none; } body { cursor: auto; }
    .sound-btn { cursor: auto; }
}
@media (max-width: 600px) { .video-grid { column-count: 1; } }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="custom-cursor"></div>

    <header>
        <a href="cv.html" class="back-btn">← BACK TO C.V</a>
        <div class="page-indicator">Off The Record</div>
    </header>

    <main class="bside-container">
        
        <div class="bside-hero">
            <h1>Fragments & Inspirations</h1>
            <p>DAILY LOG / ARCHIVE / TASTE</p>
        </div>

        <div class="video-grid" id="video-grid"></div>
    </main>

    <script>
        // ▼▼▼ 취미 영상은 여기에 추가하세요 (위에서부터 순서대로 보여요) ▼▼▼
        // mp4 파일:  { src: 'images/bside/01.mp4', poster: 'images/bside/01.jpg', caption: 'Paris, 2021' }
        // 유튜브:    { youtube: '영상ID', caption: 'Weekend Vibe' }
        const VIDEOS = [
            { src: 'images/bside/01.mp4', poster: 'images/bside/01.jpg', caption: 'Coldplay — In My Place (Band Cover)' }
        ];
        // ▲▲▲ -------------------------------------------------------- ▲▲▲

        (function () {
            const grid = document.getElementById('video-grid');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (!VIDEOS.length) {
                grid.outerHTML = '<p class="video-empty">VIDEOS COMING SOON</p>';
                return;
            }

            // 화면에 보일 때만 재생(데이터·배터리 절약)
            const io = new IntersectionObserver((entries) => {
                entries.forEach((e) => {
                    if (e.isIntersecting) e.target.play().catch(() => {});
                    else e.target.pause();
                });
            }, { threshold: 0.5 });

            if (VIDEOS.length === 1) { grid.style.columnCount = '1'; grid.style.maxWidth = '960px'; grid.style.margin = '0 auto'; }

            VIDEOS.forEach((v) => {
                const fig = document.createElement('figure');
                fig.className = 'video-card';
                const frame = document.createElement('div');
                frame.className = 'video-frame';

                if (v.youtube) {
                    const f = document.createElement('iframe');
                    f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(v.youtube);
                    f.title = v.caption || 'Video';
                    f.loading = 'lazy';
                    f.allowFullscreen = true;
                    f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    frame.appendChild(f);
                } else if (v.src) {
                    const el = document.createElement('video');
                    el.src = v.src;
                    if (v.poster) el.poster = v.poster;
                    el.setAttribute('muted', '');
                    el.muted = true;
                    el.loop = true;
                    el.playsInline = true;
                    el.preload = 'metadata';
                    frame.appendChild(el);

                    if (reduceMotion) {
                        el.controls = true;           // 움직임 줄이기: 자동재생 대신 직접 재생
                    } else {
                        io.observe(el);
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'sound-btn';
                        btn.textContent = 'SOUND OFF';
                        btn.addEventListener('click', () => {
                            el.muted = !el.muted;
                            btn.textContent = el.muted ? 'SOUND OFF' : 'SOUND ON';
                        });
                        frame.appendChild(btn);
                    }
                } else {
                    return;
                }

                fig.appendChild(frame);
                if (v.caption) {
                    const cap = document.createElement('figcaption');
                    cap.textContent = v.caption;
                    fig.appendChild(cap);
                }
                grid.appendChild(fig);
            });
        })();
    </script>
    <script>
        // 커서 및 페이드 아웃 스크립트
        const cursor = document.querySelector('.custom-cursor');
        const links = document.querySelectorAll('a');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
        });

        links.forEach(link => {
            link.addEventListener('mouseenter', () => { cursor.classList.add('hover'); });
            link.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); });
            
            link.addEventListener('click', function(e) {
                if (this.target === '_blank' || this.getAttribute('href').startsWith('mailto:')) return;
                e.preventDefault();
                const targetUrl = this.href;
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = targetUrl; }, 500); 
            });
        });
    </script>
    <script src="site.js"></script>
</body>
</html>
